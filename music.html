<!DOCTYPE html>
<html>
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Stellara - Music</title>
	<link rel="stylesheet" href="data/style.css" type="text/css" media="all">
	<link rel="stylesheet" href="data/layout.css" type="text/css" media="all">
	<script defer src="data/sidebar.js"></script>
	<link rel="stylesheet" href="data/player.css" type="text/css" media="all">
	<link rel="stylesheet" href="data/music.css" type="text/css" media="all">
	<script type="module" src="data/searchbar.js"></script>
</head>
<body>
	<div class="menu-box">
		<div class="track-info-menu">
			<div class="menu-bar">
				<button class="close-info-menu-button">X</button>
				<button class="size-info-menu-button">□</button>
				<button class="raw-data-menu-button">Raw Data</buttom>
				<button class="track-info-menu-button">Track Info</button>
			</div>
			<div class="info-menu">
				info go here
			</div>
			<div class="raw-data-menu">test</div>
		</div>
	</div>
	<div class="topbar">
		<button class="sidebar-toggle" aria-label="Toggle sidebar">☰</button>
	</div>
	<div class="sidebar no-anim">
		<div class="sidebar-content">
			<h1 class="title">Stellara</h1>
			<h2 class="page-index-item">
				<a class="page-link" href="https://stellara.nicholasjdi.dev/home">Home</a>
			</h2>
			<h3 class="page-index-item">
				<a class="page-link" href="https://stellara.nicholasjdi.dev/home#about">About</a>
			</h3>
            <h3 class="page-index-item">
				<a class="page-link" href="https://stellara.nicholasjdi.dev/home#contact">Contact</a>
            </h3>
			<h3 class="page-index-item">
				<a class="page-link" href="https://stellara.nicholasjdi.dev/home#attribution">Attribution</a>
			</h3>
			<h2 class="page-index-item">
                <a class="page-link current" href="https://stellara.nicholasjdi.dev/music">Music</a>
			</h2>
			<script defer src="data/player.js"></script>
		</div>
	</div>
	<div class="content">
		<div class="content-inner">
			<div class="filter-box">
				<input type="text" class="searchbar" placeholder="Search...">
				<button class="sort">Sort v</button>
				<div class="sort-dropdown">
					<button class="sort-dropdown-item" id="none">None</button>
					<button class="sort-dropdown-item" id="none-reversed">None Reversed</button>
					<button class="sort-dropdown-item" id="title">Title</button>
					<button class="sort-dropdown-item" id="title-reversed">Title Reversed</button>
					<button class="sort-dropdown-item" id="album">Album</button>
					<button class="sort-dropdown-item" id="album-reversed">Album Reversed</button>
					<button class="sort-dropdown-item" id="date">Date</button>
					<button class="sort-dropdown-item" id="date-reversed">Date Reversed</button>
					<button class="sort-dropdown-item" id="type">Type</button>
					<button class="sort-dropdown-item" id="type-reversed">Type Reversed</button>
				</div>
			</div>
			<div class="song-list"><h2 class="no-results-text">No Results</h2></div>
			<div class="dropdown">
				<a class="dropdown-item" id="download-with-art" target="_blank" download="">Download<br>(With Art)</a>
				<a class="dropdown-item" id="download-no-art" target="_blank" download="">Download<br>(No Art)</a>
				<a class="dropdown-item" id="download-library" target="_blank" download="">Download<br>(Library)</a>
				<a class="dropdown-item" id="download-art-high-res" target="_blank" download="">Download<br>Cover Art</a>
				<button class="dropdown-item" id="open-menu">More Track Info..</button>
			</div>
		</div>
	</div>
</body>
</html>
